name: Generate Snake Animation

# Generates an SVG of a snake eating your contribution grid, pushes it to
# the `output` branch. The README references those SVGs by raw URL.
#
# Triggered:
#   - daily at 00:00 UTC
#   - on every push to main (so updates appear immediately)
#   - manually via Actions tab "Run workflow"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: dentar142
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
